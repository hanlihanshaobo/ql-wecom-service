services:
  ql-wecom:
    image: ghcr.io/hanlihanshaobo/ql-wecom-service:latest
    container_name: ql-wecom
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    # QL_BASE_URL 需指向宿主机 Docker 网桥网关（如 172.20.0.1），不能写 localhost
    # 查看网关: docker network inspect bridge --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
